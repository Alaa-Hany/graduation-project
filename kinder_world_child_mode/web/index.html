<!DOCTYPE html><html lang="en"><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kinder World is a safe learning app for children, with lessons, stories, games and an AI buddy, plus progress reports and controls for parents.">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kinder World">
  <link rel="apple-touch-icon" href="icons/kinderworld-logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/kinderworld-logo.png">

  <style>
    /* Keep Flutter Web from fetching fallback fonts over the network. */
    @font-face {
      font-family: 'Roboto';
      src: local('Segoe UI'), local('Arial');
      font-display: swap;
    }

    @font-face {
      font-family: 'Noto Sans Arabic';
      src: local('Segoe UI'), local('Tahoma'), local('Arial');
      font-display: swap;
    }

    @font-face {
      font-family: 'Noto Color Emoji';
      src: local('Segoe UI Emoji'), local('Segoe UI Symbol');
      font-display: swap;
    }
  </style>

  <title>Kinder World</title>
  <link rel="manifest" href="manifest.json">

  <!-- Removes any service worker left by older builds (see the file). -->
  <script src="sw_cleanup.js"></script>
  <style>
    /* No native web splash: the blue logo page used to linger until the Flutter
       engine rendered its first frame, which felt slow. We now show a neutral
       white background during engine load and let the in-app Flutter splash
       (SplashScreen widget) be the only branded splash. */
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
    }
  </style>
  <!-- Zoom stays allowed (no user-scalable / maximum-scale limits): people who need to zoom must be able to. -->
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
</head>
<body>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
